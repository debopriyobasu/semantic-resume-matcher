services:
  api:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-Semantic Resume Matcher}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://resume_matcher:resume_matcher@postgres:5432/resume_matcher}
      USE_OLLAMA: ${USE_OLLAMA:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: resume_matcher
      POSTGRES_USER: resume_matcher
      POSTGRES_PASSWORD: resume_matcher
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
